<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders | TradeSphere</title>
    <meta name="description" content="Track and manage your TradeSphere orders." />
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/pages/cart.css" />
    <link rel="stylesheet" href="../css/pages/orders.css" />
      <!-- PWA-META -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2f6fed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="TradeSphere" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TradeSphere" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div data-component="navbar"></div>

    <main id="main">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <span class="breadcrumb__item"><a href="../index.html">Home</a></span>
          <span class="breadcrumb__item" aria-current="page">My Orders</span>
        </nav>

        <div class="page-header">
          <h1 class="page-header__title">My Orders</h1>
          <p class="page-header__subtitle" data-orders-count></p>
        </div>

        <div class="orders-list" data-orders></div>

        <div class="page-placeholder" data-orders-empty hidden>
          <span class="page-placeholder__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
          </span>
          <h2 class="page-placeholder__title">No orders yet</h2>
          <p class="page-placeholder__text">
            When you place an order it will show up here with tracking details.
          </p>
          <a class="btn btn--primary" href="products.html">Start shopping</a>
        </div>
      </div>
    </main>

    <div data-component="footer"></div>

    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/pages/orders.js"></script>
  </body>
</html>
