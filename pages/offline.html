<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're Offline | Marketplace</title>
    <meta name="description" content="You appear to be offline. Reconnect to keep shopping on Marketplace." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/main.css" />
      <!-- PWA-META -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2f6fed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Marketplace" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Marketplace" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div data-component="navbar"></div>

    <main id="main">
      <div class="container">
        <div class="error-page">
          <p class="error-page__code" aria-hidden="true">Offline</p>
          <h1 class="error-page__title">You're offline</h1>
          <p class="error-page__text">
            The connection was lost. Once you're back online, refresh the page
            to keep browsing and shopping.
          </p>
          <div class="u-flex u-gap-3 u-flex-wrap u-justify-center">
            <button class="btn btn--primary" type="button" data-retry>
              Try Again
            </button>
            <a class="btn btn--outline" href="../index.html">Back to Home</a>
          </div>
        </div>
      </div>
    </main>

    <div data-component="footer"></div>

    <script type="module" src="../js/app.js"></script>
  </body>
</html>
