<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile | TradeSphere</title>
    <meta name="description" content="Manage your TradeSphere profile and settings." />
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/pages/profile.css" />
      <!-- PWA-META -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2f6fed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="TradeSphere" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TradeSphere" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div data-component="navbar"></div>

    <main id="main">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <span class="breadcrumb__item"><a href="../index.html">Home</a></span>
          <span class="breadcrumb__item" aria-current="page">My Profile</span>
        </nav>
      </div>

      <div class="container profile-page">
        <section class="profile-header" aria-label="Account summary">
          <span class="profile-avatar" data-profile-avatar aria-hidden="true">–</span>
          <div class="profile-header__info">
            <h1 class="profile-header__name" data-profile-name>Your account</h1>
            <p class="profile-header__email" data-profile-email></p>
          </div>
          <span class="badge badge--primary profile-header__role" data-profile-role>Customer</span>
        </section>

        <div class="profile-grid">
          <section class="profile-section card" aria-labelledby="profile-details-title">
            <h2 class="profile-section__title" id="profile-details-title">
              Personal details
            </h2>
            <p class="profile-section__hint">
              Update your name and contact email. These appear across the store.
            </p>

            <form id="profile-form" novalidate>
              <div class="form-row">
                <div class="form-group" data-field="firstName">
                  <label class="form-label" for="profile-first-name">
                    First name <span class="form-required">*</span>
                  </label>
                  <input
                    class="form-input"
                    id="profile-first-name"
                    type="text"
                    name="firstName"
                    autocomplete="given-name"
                    placeholder="Jane"
                  />
                  <p class="form-error"></p>
                </div>
                <div class="form-group" data-field="lastName">
                  <label class="form-label" for="profile-last-name">
                    Last name <span class="form-required">*</span>
                  </label>
                  <input
                    class="form-input"
                    id="profile-last-name"
                    type="text"
                    name="lastName"
                    autocomplete="family-name"
                    placeholder="Doe"
                  />
                  <p class="form-error"></p>
                </div>
              </div>

              <div class="form-group" data-field="email">
                <label class="form-label" for="profile-email">
                  Email address <span class="form-required">*</span>
                </label>
                <input
                  class="form-input"
                  id="profile-email"
                  type="email"
                  name="email"
                  autocomplete="email"
                  placeholder="you@example.com"
                />
                <p class="form-error"></p>
              </div>

              <button class="btn btn--primary" type="submit" data-submit>
                <span class="btn__label">Save changes</span>
                <span class="spinner spinner--sm spinner--white" data-submit-spinner hidden></span>
              </button>
            </form>
          </section>

          <section class="profile-section card" aria-labelledby="profile-password-title">
            <h2 class="profile-section__title" id="profile-password-title">
              Change password
            </h2>
            <p class="profile-section__hint">
              Choose a new password you haven't used before.
            </p>

            <form id="password-form" novalidate>
              <div class="form-group" data-field="currentPassword">
                <label class="form-label" for="profile-current-password">
                  Current password <span class="form-required">*</span>
                </label>
                <div class="password-field">
                  <input
                    class="form-input"
                    id="profile-current-password"
                    type="password"
                    name="currentPassword"
                    autocomplete="current-password"
                    placeholder="Your current password"
                    data-password-input
                  />
                  <button class="password-toggle" type="button" data-password-toggle aria-label="Show password">
                    <span data-eye-open>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </span>
                    <span data-eye-closed hidden>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 11s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/><path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"/></svg>
                    </span>
                  </button>
                </div>
                <p class="form-error"></p>
              </div>

              <div class="form-group" data-field="newPassword">
                <label class="form-label" for="profile-new-password">
                  New password <span class="form-required">*</span>
                </label>
                <div class="password-field">
                  <input
                    class="form-input"
                    id="profile-new-password"
                    type="password"
                    name="newPassword"
                    autocomplete="new-password"
                    placeholder="At least 8 characters"
                    data-password-input
                  />
                  <button class="password-toggle" type="button" data-password-toggle aria-label="Show password">
                    <span data-eye-open>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </span>
                    <span data-eye-closed hidden>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 11s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/><path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"/></svg>
                    </span>
                  </button>
                </div>
                <p class="form-hint u-mt-1">Use at least 8 characters with letters and numbers.</p>
                <p class="form-error"></p>
              </div>

              <div class="form-group" data-field="confirmPassword">
                <label class="form-label" for="profile-confirm-password">
                  Confirm new password <span class="form-required">*</span>
                </label>
                <div class="password-field">
                  <input
                    class="form-input"
                    id="profile-confirm-password"
                    type="password"
                    name="confirmPassword"
                    autocomplete="new-password"
                    placeholder="Re-enter your new password"
                    data-password-input
                  />
                  <button class="password-toggle" type="button" data-password-toggle aria-label="Show password">
                    <span data-eye-open>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </span>
                    <span data-eye-closed hidden>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 11s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/><path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"/></svg>
                    </span>
                  </button>
                </div>
                <p class="form-error"></p>
              </div>

              <button class="btn btn--primary" type="submit" data-submit>
                <span class="btn__label">Update password</span>
                <span class="spinner spinner--sm spinner--white" data-submit-spinner hidden></span>
              </button>
            </form>
          </section>
        </div>
      </div>
    </main>

    <div data-component="footer"></div>

    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/pages/profile.js"></script>
  </body>
</html>
