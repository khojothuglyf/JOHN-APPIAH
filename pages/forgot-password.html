<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Marketplace</title>
    <meta name="description" content="Reset your Marketplace account password." />
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/pages/auth.css" />
  </head>
  <body>
    <div data-component="navbar"></div>

    <main id="main" class="auth-page">
      <div class="container">
        <div class="auth-card">
          <a class="auth-back" href="../index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            Back to home
          </a>

          <div class="auth-card__brand">
            <img class="auth-card__logo" src="../images/logo.svg" alt="Marketplace logo" width="52" height="52" />
            <h1 class="auth-card__title">Reset your password</h1>
            <p class="auth-card__subtitle">
              Enter the email you registered with and we'll send you a reset link.
            </p>
          </div>

          <div class="alert alert--error auth-alert" data-alert hidden role="alert">
            <svg class="alert__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
            <div class="alert__content">
              <p class="alert__title" data-alert-title></p>
              <p data-alert-message></p>
            </div>
          </div>

          <form class="auth-card__form" id="forgot-form" novalidate>
            <div class="form-group" data-field="email">
              <label class="form-label" for="forgot-email">
                Email address <span class="form-required">*</span>
              </label>
              <input
                class="form-input"
                id="forgot-email"
                type="email"
                name="email"
                autocomplete="email"
                placeholder="you@example.com"
              />
              <p class="form-error"></p>
            </div>

            <button class="btn btn--primary btn--block btn--lg" type="submit" data-submit>
              <span class="btn__label">Send Reset Link</span>
              <span class="spinner spinner--sm spinner--white" data-submit-spinner hidden></span>
            </button>
          </form>

          <div class="auth-success" data-success hidden>
            <span class="auth-success__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
            </span>
            <h2 class="auth-success__title">Check your inbox</h2>
            <p class="auth-success__text" data-success-message></p>
            <a class="btn btn--primary" href="login.html">Back to Sign In</a>
          </div>

          <div class="auth-divider" data-form-footer>Remembered your password?</div>
          <a class="btn btn--outline btn--block" href="login.html" data-form-footer>Back to Sign In</a>
        </div>
      </div>
    </main>

    <div data-component="footer"></div>

    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/pages/forgot-password.js"></script>
  </body>
</html>
